/* ===== src/lib/anim.jsx ===== */
(function(){

// ============================================================
// OBSERVER GLOBAL — una sola instancia atiende a todo
// [data-anim] y a los nodos .reveal de la página.
// ============================================================
function startGlobalObserver() {
  const fire = (el) => {
    const delay = parseFloat(el.dataset.delay || '0');
    const apply = () => {
      el.classList.add('anim-in');
      if (el.classList.contains('reveal')) el.classList.add('visible');
    };
    if (delay > 0) setTimeout(apply, delay * 1000);
    else apply();
  };

  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          fire(e.target);
          io.unobserve(e.target);
        }
      });
    },
    { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
  );

  const scan = (root) => {
    root.querySelectorAll('[data-anim]:not(.anim-in), .reveal:not(.visible)').forEach((n) => io.observe(n));
  };
  scan(document);

  // Los nodos que React monta después también se observan.
  const mo = new MutationObserver((muts) => {
    for (const m of muts) {
      m.addedNodes.forEach((n) => {
        if (n.nodeType !== 1) return;
        if (n.matches('[data-anim]') || n.matches('.reveal')) io.observe(n);
        scan(n);
      });
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });

  return () => {
    mo.disconnect();
    io.disconnect();
  };
}

// ============================================================
// CURSOR CUSTOM — anillo + punto con lerp
// ============================================================
function startCustomCursor() {
  if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return () => {};
  const ring = document.getElementById('cc-ring');
  const dot = document.getElementById('cc-dot');
  if (!ring || !dot) return () => {};

  let mx = window.innerWidth / 2;
  let my = window.innerHeight / 2;
  let rx = mx;
  let ry = my;
  let raf;

  const onMove = (e) => {
    mx = e.clientX;
    my = e.clientY;
    dot.style.transform = 'translate3d(' + mx + 'px, ' + my + 'px, 0)';
  };

  const tick = () => {
    rx += (mx - rx) * 0.18;
    ry += (my - ry) * 0.18;
    ring.style.transform = 'translate3d(' + rx + 'px, ' + ry + 'px, 0)';
    raf = requestAnimationFrame(tick);
  };

  const isInteractive = (node) => {
    let el = node;
    while (el && el !== document.body) {
      if (el.matches && el.matches('a, button, [role="button"], [data-cursor="grow"]')) return true;
      el = el.parentElement;
    }
    return false;
  };
  const onOver = (e) => {
    if (isInteractive(e.target)) document.body.classList.add('cc-active');
    else document.body.classList.remove('cc-active');
  };

  window.addEventListener('mousemove', onMove, { passive: true });
  document.addEventListener('mouseover', onOver, { passive: true });
  tick();

  return () => {
    window.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseover', onOver);
    if (raf) cancelAnimationFrame(raf);
  };
}

// ============================================================
// MagneticCard — tilt 3D siguiendo al cursor
// ============================================================
const MagneticCard = ({ children, className = '', style = {}, maxTilt = 6 }) => {
  const ref = useRef(null);

  const onMove = (e) => {
    const card = ref.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const dx = (e.clientX - rect.left) / rect.width - 0.5;
    const dy = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.setProperty('--rx', dy * -maxTilt + 'deg');
    card.style.setProperty('--ry', dx * maxTilt + 'deg');
  };

  const onLeave = () => {
    const card = ref.current;
    if (!card) return;
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  };

  return (
    <div
      ref={ref}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      className={className}
      style={{
        ...style,
        transform: 'perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0)',
        transition: 'transform 0.45s cubic-bezier(0.16,1,0.3,1)',
        transformStyle: 'preserve-3d',
        willChange: 'transform',
      }}
    >
      {children}
    </div>
  );
};

Object.assign(window,{startGlobalObserver,startCustomCursor,MagneticCard});
})();

/* ===== src/lib/leads.js ===== */
(function(){
// ============================================================================
// Envío de leads + eventos de tracking.
//
// - El lead se manda por POST JSON a un Inbound Webhook de GoHighLevel.
//   La URL vive en VITE_GHL_WEBHOOK_URL (nunca hardcodeada). Ver GHL_WEBHOOK_SETUP.md
// - Si falla, se reintenta una vez y luego se prueba el endpoint de respaldo
//   opcional (VITE_LEAD_BACKUP_WEBHOOK_URL).
// - Nada de esto bloquea al usuario: la promesa SIEMPRE resuelve.
// ============================================================================

const WEBHOOK_URL = undefined;
const BACKUP_URL = undefined;

const WHATSAPP_LINK = 'https://wa.link/49rcpk';



// Eventos defensivos: si el pixel / GA no está instalado, no hacen nada.
function trackLead() {
  try {
    if (typeof window.fbq === 'function') window.fbq('track', 'Lead');
    if (typeof window.gtag === 'function') window.gtag('event', 'generate_lead');
    if (Array.isArray(window.dataLayer)) window.dataLayer.push({ event: 'generate_lead' });
  } catch (err) {
    console.error('[tracking] no se pudo disparar el evento de lead:', err);
  }
}

// Divide "Nombre y Apellido" en first_name / last_name para mapearlo fácil en GHL.
function splitName(fullName) {
  const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return { first_name: '', last_name: '' };
  if (parts.length === 1) return { first_name: parts[0], last_name: '' };
  return { first_name: parts[0], last_name: parts.slice(1).join(' ') };
}

// Teléfono en formato E.164: +<código><número sin separadores>
function toE164(dialCode, localNumber) {
  const digits = String(localNumber).replace(/\D/g, '').replace(/^0+/, '');
  return dialCode + digits;
}

function buildLeadPayload(form) {
  const { first_name, last_name } = splitName(form.name);
  return {
    first_name,
    last_name,
    full_name: String(form.name).trim(),
    email: String(form.email).trim(),
    phone: toE164(form.country.code, form.whatsapp),
    phone_country_code: form.country.code,
    phone_country_iso: form.country.iso,
    phone_country_name: form.country.name,
    instagram_handle: String(form.instagram).trim(),
    sells_digitally: form.salesStatus,
    monthly_ad_budget: form.budget,
    source: 'Landing maferguevara.com',
    form_name: 'Diagnóstico estratégico',
    page_url: typeof window !== 'undefined' ? window.location.href : '',
    submitted_at: new Date().toISOString(),
  };
}

async function postJson(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res;
}

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/**
 * Manda el lead. Nunca lanza: devuelve { ok, via }.
 * El flujo del formulario continúa igual si esto falla.
 */
async function sendLead(payload) {
  if (!WEBHOOK_URL) {
    // Sin URL configurada: se saltea el envío en silencio y el usuario sigue.
    return { ok: false, via: 'skipped' };
  }

  for (let attempt = 1; attempt <= 2; attempt += 1) {
    try {
      await postJson(WEBHOOK_URL, payload);
      return { ok: true, via: 'ghl' };
    } catch (err) {
      console.error('[lead] intento ' + attempt + ' al webhook de GHL falló:', err);
      if (attempt === 1) await wait(800);
    }
  }

  if (BACKUP_URL) {
    try {
      await postJson(BACKUP_URL, payload);
      return { ok: true, via: 'backup' };
    } catch (err) {
      console.error('[lead] el endpoint de respaldo también falló:', err);
    }
  }

  return { ok: false, via: 'failed' };
}

Object.assign(window,{WEBHOOK_URL,BACKUP_URL,WHATSAPP_LINK,trackLead,splitName,toE164,buildLeadPayload,postJson,wait,sendLead});
})();

/* ===== src/components/StyledSelect.jsx ===== */
(function(){

const StyledSelect = ({ id, labelId, value, onChange, options, placeholder }) => {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return undefined;
    const onDocClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    const onEsc = (e) => {
      if (e.key === 'Escape') setOpen(false);
    };
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onEsc);
    return () => {
      document.removeEventListener('mousedown', onDocClick);
      document.removeEventListener('keydown', onEsc);
    };
  }, [open]);

  return (
    <div ref={wrapRef} className="relative">
      <button
        type="button"
        id={id}
        onClick={() => setOpen((v) => !v)}
        className="w-full inline-flex items-center justify-between gap-3"
        style={{
          background: 'rgba(13,13,13,0.85)',
          border: '1px solid ' + (open ? '#07e570' : 'rgba(7,229,112,0.18)'),
          color: value ? '#f5f5f0' : 'rgba(245,245,240,0.55)',
          fontFamily: 'Genos, sans-serif',
          fontSize: '1.05rem',
          fontWeight: value ? 400 : 300,
          borderRadius: 8,
          padding: '14px 18px',
          cursor: 'pointer',
          outline: 'none',
          textAlign: 'left',
          transition: 'border-color 0.25s ease, box-shadow 0.25s ease',
          boxShadow: open ? '0 0 0 4px rgba(7,229,112,0.10)' : 'none',
        }}
        aria-haspopup="listbox"
        aria-expanded={open}
        aria-labelledby={labelId}
      >
        <span style={{ flex: 1, lineHeight: 1.3 }}>{value || placeholder}</span>
        <svg

          height="14"
          viewBox="0 0 12 12"

          aria-hidden="true"
          style={{ flexShrink: 0, transition: 'transform 0.2s ease', transform: open ? 'rotate(180deg)' : 'none', color: '#07e570' }}
        >
          <path d="M2 4l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" fill="none" />
        </svg>
      </button>

      {open && (
        <ul
          className="absolute z-50 mt-2 left-0 right-0"

            background: 'rgba(10,10,10,0.98)',
            border: '1px solid rgba(7,229,112,0.25)',

            margin: 0,
            padding: 6,
            maxHeight: 320,

          }}
          role="listbox"
        >
          {options.map((opt) => {
            const selected = opt === value;
            return (
              <li key={opt} role="option" aria-selected={selected}>
                <button
                  type="button"
                  onClick={() => {
                    onChange(opt);
                    setOpen(false);
                  }}
                  className="w-full"
                  style={{
                    background: selected ? 'rgba(7,229,112,0.10)' : 'transparent',
                    border: 'none',
                    color: '#f5f5f0',

                    display: 'block',

};

(function(){

const STEPS = [

];

const Approach = () => {
  const bgRef = useRef(null);

  useEffect(() => {
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const el = bgRef.current;
        if (!el) {
          raf = null;
          return;
        }
        const r = el.getBoundingClientRect();
        const center = r.top + r.height / 2;
        const p = (center - window.innerHeight / 2) / window.innerHeight;
        const y = Math.max(Math.min(p * -120, 140), -140);
        el.style.transform = 'translate3d(0, ' + y + 'px, 0)';
        raf = null;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <Section id="metodo">

(function(){

const SectionDivider = () => (
  <div className="relative mx-auto w-full max-w-[1440px] px-6">
    <div className="section-divider w-full" data-anim="line-grow" />
  </div>
);

function App() {
  useEffect(() => {
    let raf = null;
    let nx = window.innerWidth / 2;
    let ny = window.innerHeight / 2;

    const apply = () => {
      document.documentElement.style.setProperty('--cursor-x', nx + 'px');
      document.documentElement.style.setProperty('--cursor-y', ny + 'px');
      raf = null;
    };
    const onMove = (e) => {
      nx = e.clientX;
      ny = e.clientY;
      if (!raf) raf = requestAnimationFrame(apply);
    };
    window.addEventListener('mousemove', onMove, { passive: true });

    const stopObserver = startGlobalObserver();
    const stopCursor = startCustomCursor();

    return () => {
      window.removeEventListener('mousemove', onMove);
      if (raf) cancelAnimationFrame(raf);
      stopObserver();
      stopCursor();
    };
  }, []);

  return (
    <div className="relative">
      <Navbar />
      <main>
        <Hero />
        <SectionDivider />
        <FalseSolution />
        <SectionDivider />
        <WhenReady />
        <SectionDivider />
        <Approach />
        <WithWho />
